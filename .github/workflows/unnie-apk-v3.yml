    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore UNNIE Android source
        shell: bash
        run: |
          mkdir -p /tmp/unnie-beta
          printf '%s' "$SOURCE_B64" | tr -d '[:space:]' | base64 -d | tar -xz -C /tmp/unnie-beta
          test -f /tmp/unnie-beta/settings.gradle
          test -f /tmp/unnie-beta/app/src/main/assets/index.html

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: /tmp/unnie-beta
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Prepare named APK
        shell: bash
        run: cp /tmp/unnie-beta/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/UNNIE-Beta-0.1.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UNNIE-Beta-0.1-APK
          path: UNNIE-Beta-0.1.apk
          if-no-files-found: error
          retention-days: 14
