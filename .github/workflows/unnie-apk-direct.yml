name: Build UNNIE Beta 0.3 APK

on:
  push:
    branches:
      - unnie-apk-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore UNNIE Beta 0.2 Android source
        shell: bash
        run: |
          cat unnie-beta-v02.part1 unnie-beta-v02.part2 unnie-beta-v02.part3 unnie-beta-v02.part4 | base64 -d > /tmp/unnie-beta-v02-source.tar.gz
          echo "66b5bb2dfbc2e05d28a6186555d50af991dfe5b0a1fafa682d84283bb31180ad  /tmp/unnie-beta-v02-source.tar.gz" | sha256sum -c -
          mkdir -p /tmp/unnie-beta
          tar -xzf /tmp/unnie-beta-v02-source.tar.gz -C /tmp/unnie-beta
          test -f /tmp/unnie-beta/settings.gradle
          test -f /tmp/unnie-beta/app/src/main/assets/index.html
          test -f /tmp/unnie-beta/app/src/main/java/com/unnie/notes/beta/MainActivity.java
          grep -q "UNNIE Beta 0.2" /tmp/unnie-beta/app/src/main/assets/index.html

      - name: Apply UNNIE Beta 0.3 share UI and native sharing
        working-directory: /tmp/unnie-beta
        run: |
          patch -p1 < "$GITHUB_WORKSPACE/unnie-v03.patch"
          grep -q "UNNIE Beta 0.3" app/src/main/assets/index.html
          grep -q ">공유<" app/src/main/assets/index.html
          grep -q "data-act=\"share\"" app/src/main/assets/index.html
          grep -q "shareImages" app/src/main/java/com/unnie/notes/beta/MainActivity.java
          grep -q "FileProvider" app/src/main/AndroidManifest.xml
          test -f app/src/main/res/xml/file_paths.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: /tmp/unnie-beta
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Prepare named APK
        run: cp /tmp/unnie-beta/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/UNNIE-Beta-0.3.apk"

      - name: Verify APK
        run: |
          test -s UNNIE-Beta-0.3.apk
          unzip -l UNNIE-Beta-0.3.apk | grep -E 'AndroidManifest.xml|classes.dex|assets/index.html'
          unzip -p UNNIE-Beta-0.3.apk assets/index.html | grep -q "UNNIE Beta 0.3"
          unzip -p UNNIE-Beta-0.3.apk assets/index.html | grep -q ">공유<"
          sha256sum UNNIE-Beta-0.3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UNNIE-Beta-0.3-APK
          path: UNNIE-Beta-0.3.apk
          if-no-files-found: error
          retention-days: 14
