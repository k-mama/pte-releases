name: Build UNNIE APK Direct

on:
  push:
    branches:
      - unnie-apk-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android source
        run: |
          mkdir -p /tmp/unnie-beta
          tar -xzf unnie-beta-source.tar.gz -C /tmp/unnie-beta
          test -f /tmp/unnie-beta/settings.gradle
          test -f /tmp/unnie-beta/app/src/main/assets/index.html

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: /tmp/unnie-beta
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Prepare named APK
        run: cp /tmp/unnie-beta/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/UNNIE-Beta-0.1.apk"

      - name: Verify APK
        run: |
          test -s UNNIE-Beta-0.1.apk
          unzip -l UNNIE-Beta-0.1.apk | grep -E 'AndroidManifest.xml|classes.dex'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UNNIE-Beta-0.1-APK
          path: UNNIE-Beta-0.1.apk
          if-no-files-found: error
          retention-days: 14
