name: Build UNNIE Beta APK

on:
  push:
    branches: [unnie-apk-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore UNNIE Android source
        shell: bash
        run: |
          mkdir -p /tmp/unnie-beta
          cat > /tmp/unnie-source.b64 <<'B64'

B64
          base64 -d /tmp/unnie-source.b64 | tar -xz -C /tmp/unnie-beta
          find /tmp/unnie-beta -maxdepth 3 -type f | sort

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: /tmp/unnie-beta
        run: gradle --no-daemon assembleDebug

      - name: Prepare named APK
        run: cp /tmp/unnie-beta/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/UNNIE-Beta-0.1.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UNNIE-Beta-0.1-APK
          path: UNNIE-Beta-0.1.apk
          if-no-files-found: error
          retention-days: 14
