name: Build TIDY APK Public Temp

on:
  push:
    branches:
      - tidy-apk-build-v0.2-temp
    paths:
      - ".github/workflows/tidy-apk-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify part 00
        continue-on-error: true
        run: echo "90ac9d2d5da10951d8244ca09b2b803c12ed166cd09cf8edd194af0230daf891  tidy-build/chunks/part_00" | sha256sum -c -
      - name: Verify part 01
        continue-on-error: true
        run: echo "b776f6b7a989baf221bac3a5b9f33778b778775aaf0ba384e66d552d0023d324  tidy-build/chunks/part_01" | sha256sum -c -
      - name: Verify part 02
        continue-on-error: true
        run: echo "51797e89c67faddda6cddbcdb1722b2b4d55ce678c74f93d6401cfb594e1303a  tidy-build/chunks/part_02" | sha256sum -c -
      - name: Verify part 03
        continue-on-error: true
        run: echo "71e355efb465a76a6d815dbe9fa72eb9f6cf0fc7f61c1b5a554cf7bb64e354fe  tidy-build/chunks/part_03" | sha256sum -c -
      - name: Verify part 04
        continue-on-error: true
        run: echo "625b61c5cd91f4c4fd54d25c2b5b3230ed38ea9181e759849780933da03d0446  tidy-build/chunks/part_04" | sha256sum -c -
      - name: Verify part 05
        continue-on-error: true
        run: echo "20a2e73ad6837a7de916444358fd783bf1d860dea80cb66f9c4397a9dc5ef7a2  tidy-build/chunks/part_05" | sha256sum -c -
      - name: Verify part 06
        continue-on-error: true
        run: echo "f47b8c353f090136bc0e0f8ef94f91f7ab82603cc59ad4b4174c02cfe3621734  tidy-build/chunks/part_06" | sha256sum -c -
      - name: Verify part 07
        continue-on-error: true
        run: echo "9368d56bfa05dd5f95c85755e36d1ebb3eeb1c2fbac9a0252717045a7ee0e442  tidy-build/chunks/part_07" | sha256sum -c -

      - name: Verify all source chunks
        run: |
          echo "90ac9d2d5da10951d8244ca09b2b803c12ed166cd09cf8edd194af0230daf891  tidy-build/chunks/part_00" | sha256sum -c -
          echo "b776f6b7a989baf221bac3a5b9f33778b778775aaf0ba384e66d552d0023d324  tidy-build/chunks/part_01" | sha256sum -c -
          echo "51797e89c67faddda6cddbcdb1722b2b4d55ce678c74f93d6401cfb594e1303a  tidy-build/chunks/part_02" | sha256sum -c -
          echo "71e355efb465a76a6d815dbe9fa72eb9f6cf0fc7f61c1b5a554cf7bb64e354fe  tidy-build/chunks/part_03" | sha256sum -c -
          echo "625b61c5cd91f4c4fd54d25c2b5b3230ed38ea9181e759849780933da03d0446  tidy-build/chunks/part_04" | sha256sum -c -
          echo "20a2e73ad6837a7de916444358fd783bf1d860dea80cb66f9c4397a9dc5ef7a2  tidy-build/chunks/part_05" | sha256sum -c -
          echo "f47b8c353f090136bc0e0f8ef94f91f7ab82603cc59ad4b4174c02cfe3621734  tidy-build/chunks/part_06" | sha256sum -c -
          echo "9368d56bfa05dd5f95c85755e36d1ebb3eeb1c2fbac9a0252717045a7ee0e442  tidy-build/chunks/part_07" | sha256sum -c -

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Restore and verify TIDY source
        run: |
          cat tidy-build/chunks/part_* > /tmp/tidy_source.b64
          base64 -d /tmp/tidy_source.b64 > /tmp/tidy_source.zip
          echo "0fe8bc8ad674e2f96e337b877909d7b7ff77ba0a78d665c1ad7233e60b18f762  /tmp/tidy_source.zip" | sha256sum -c -
          mkdir -p /tmp/tidy
          unzip -q /tmp/tidy_source.zip -d /tmp/tidy

      - name: Run unit tests
        working-directory: /tmp/tidy/TIDY_Android_V0.2
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest 2>&1 | tee "$GITHUB_WORKSPACE/test.log"

      - name: Build debug APK
        working-directory: /tmp/tidy/TIDY_Android_V0.2
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Prepare APK and checksum
        run: |
          cp /tmp/tidy/TIDY_Android_V0.2/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/TIDY_V0.2_Debug.apk"
          sha256sum "$GITHUB_WORKSPACE/TIDY_V0.2_Debug.apk" | tee "$GITHUB_WORKSPACE/TIDY_V0.2_Debug.apk.sha256"
          unzip -t "$GITHUB_WORKSPACE/TIDY_V0.2_Debug.apk"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TIDY_V0.2_Build_Logs
          path: |
            test.log
            build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TIDY_V0.2_Debug_APK
          path: |
            TIDY_V0.2_Debug.apk
            TIDY_V0.2_Debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
